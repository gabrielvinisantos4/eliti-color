<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eliti Color — Centro de Pinturas</title>
<meta name="description" content="Eliti Color — Centro de Pinturas. Tudo o que você precisa em tintas imobiliárias e industriais. Fale com Tiago ou Eliel pelo WhatsApp. R. Minas Gerais, 894 - Centro.">
<meta name="theme-color" content="#060c2a">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Eliti Color — Centro de Pinturas">
<meta property="og:description" content="Tudo o que você precisa em tintas imobiliárias e industriais. Fale com Tiago ou Eliel pelo WhatsApp. R. Minas Gerais, 894 - Centro.">
<!-- Ao publicar, troque por URL absoluta (ex.: https://SEU-DOMINIO/assets/eliticolor-poster.jpg) -->
<meta property="og:image" content="assets/eliticolor-poster.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logo-eliticolor.png">
<link rel="preload" as="image" href="assets/logo-eliticolor.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a1440;
    --navy-deep:#060c2a;
    --gold:#f6b80f;
    --wa:#25d366;
    --white:#ffffff;
    --muted:rgba(255,255,255,.66);
    --hair:rgba(255,255,255,.16);
    --glass:rgba(255,255,255,.07);
    --gutter:clamp(22px,6vw,72px);
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--navy-deep);color:var(--white);
    font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:999px}

  /* ---------- Vídeo em tela cheia ---------- */
  .stage{position:relative;min-height:100vh;min-height:100svh;isolation:isolate;overflow:hidden}
  .media{
    position:absolute;inset:0;z-index:-2;
    background:var(--navy) url("assets/eliticolor-poster.jpg") center/cover no-repeat; /* fallback */
  }
  .media video{width:100%;height:100%;object-fit:cover;display:block}
  .shade{
    position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,
      rgba(6,12,42,.78) 0%,
      rgba(6,12,42,.45) 22%,
      rgba(6,12,42,.24) 34%,
      rgba(6,12,42,.34) 46%,
      rgba(6,12,42,.88) 70%,
      rgba(6,12,42,.97) 100%);
  }

  /* ---------- Estrutura ---------- */
  .content{
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column;
    padding:max(28px,env(safe-area-inset-top)) var(--gutter) max(20px,env(safe-area-inset-bottom));
  }
  .brand{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:clamp(18px,6vh,64px);padding-bottom:32px;text-align:center}
  /* Frase da marca: duas camadas tipográficas */
  .tagline{
    margin-top:clamp(22px,3.6vh,36px);
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .tagline::before{content:"";width:36px;height:2px;border-radius:2px;background:var(--gold);margin-bottom:6px}
  .tagline .t1{
    font-size:clamp(15px,4.2vw,20px);font-weight:300;letter-spacing:.04em;color:rgba(255,255,255,.82);
  }
  .tagline .t2{
    font-size:clamp(20px,6.2vw,34px);font-weight:700;line-height:1.12;
    letter-spacing:.06em;text-transform:uppercase;color:#fff;
  }
  .tagline .t2 em{font-style:normal;color:var(--gold)}
  .brand img{width:min(86vw,540px);height:auto;display:block}

  .eyebrow{
    display:flex;align-items:center;gap:14px;margin-bottom:6px;
    font-size:10.5px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);
  }
  .eyebrow::before{content:"";width:28px;height:1px;background:var(--gold)}

  /* ---------- Contatos ---------- */
  .contacts{list-style:none;display:grid}
  .contact{padding:20px 0;border-bottom:1px solid var(--hair)}
  .contact:last-child{border-bottom:0}
  .who{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .name{
    font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);
  }
  .num{
    display:block;margin:6px 0 16px;
    font-size:clamp(27px,8vw,38px);font-weight:300;letter-spacing:-.01em;line-height:1.05;
    font-variant-numeric:tabular-nums lining-nums;white-space:nowrap;
    transition:color .25s var(--ease);
  }
  .num:hover{color:var(--gold)}

  /* Botão WhatsApp — vidro fosco, ícone em selo verde, seta que desliza */
  .wa{
    --h:54px;
    position:relative;display:flex;align-items:center;gap:14px;
    width:100%;height:var(--h);padding:0 8px 0 6px;border-radius:999px;
    background:var(--glass);
    border:1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
    font-size:14px;font-weight:600;letter-spacing:.02em;
    transition:background-color .35s var(--ease),border-color .35s var(--ease),color .35s var(--ease);
  }
  .wa .seal{
    width:calc(var(--h) - 12px);height:calc(var(--h) - 12px);flex:none;border-radius:50%;
    display:grid;place-items:center;background:var(--wa);color:#fff;
    transition:transform .35s var(--ease);
  }
  .wa .seal svg{width:21px;height:21px}
  .wa .label{flex:1;display:flex;flex-direction:column;line-height:1.15}
  .wa .label small{font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;opacity:.6}
  .wa .arrow{
    width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;
    transition:transform .35s var(--ease),background-color .35s var(--ease);
  }
  .wa .arrow svg{width:16px;height:16px}
  .wa:hover{background:#fff;border-color:#fff;color:var(--navy-deep)}
  .wa:hover .arrow{transform:translateX(3px);background:var(--navy-deep);color:#fff}
  .wa:hover .seal{transform:rotate(-8deg)}
  .wa:active{transform:scale(.985)}

  /* ---------- Endereço ---------- */
  /* Endereço — botão de destaque, mesmo idioma visual do WhatsApp */
  .address{margin-top:18px;padding-top:20px;border-top:1px solid var(--hair);font-style:normal}
  .map{
    display:flex;align-items:center;gap:14px;width:100%;
    min-height:72px;padding:8px 10px 8px 8px;border-radius:999px;
    background:rgba(246,184,15,.10);border:1px solid rgba(246,184,15,.45);
    -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
    transition:background-color .35s var(--ease),border-color .35s var(--ease),color .35s var(--ease);
  }
  .map .seal{
    width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;
    background:var(--gold);color:var(--navy-deep);transition:transform .35s var(--ease);
  }
  .map .seal svg{width:24px;height:24px}
  .map .label{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;line-height:1.15}
  .map .label small{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  .map .label strong{font-size:clamp(17px,5vw,21px);font-weight:600;color:#fff;white-space:nowrap}
  .map .label .sub{font-size:13px;font-weight:400;color:var(--muted)}
  .map:hover .label .sub{color:rgba(6,12,42,.7)}
  .map .arrow{
    width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.1);transition:transform .35s var(--ease),background-color .35s var(--ease);
  }
  .map .arrow svg{width:16px;height:16px}
  .map:hover{background:var(--gold);border-color:var(--gold)}
  .map:hover .label small,.map:hover .label strong{color:var(--navy-deep)}
  .map:hover .arrow{background:var(--navy-deep);color:#fff;transform:translateX(3px)}
  .map:hover .seal{background:var(--navy-deep);color:var(--gold);transform:translateY(-2px)}
  .map:active{transform:scale(.985)}

  /* ---------- Entrada sutil ---------- */
  @media (prefers-reduced-motion:no-preference){
    .brand img,.reveal{animation:rise .8s var(--ease) both}
    /* Entrada da frase: fade com desfoque e letras que se aproximam */
    .tagline::before{animation:line .9s var(--ease) .25s both}
    .tagline .t1{animation:focus 1.1s var(--ease) .35s both}
    .tagline .t2{animation:track 1.4s var(--ease) .5s both}
    @keyframes line{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
    @keyframes focus{from{opacity:0;filter:blur(8px);transform:translateY(8px)}to{opacity:1;filter:none;transform:none}}
    @keyframes track{from{opacity:0;filter:blur(10px);letter-spacing:.28em}to{opacity:1;filter:none;letter-spacing:.06em}}
    .brand img{animation-name:fade}
    .reveal.eyebrow{animation-delay:.08s}
    .contact.reveal:nth-child(1){animation-delay:.14s}
    .contact.reveal:nth-child(2){animation-delay:.22s}
    .address.reveal{animation-delay:.3s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes fade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
  }

  /* ---------- Tablet / computador ---------- */
  @media (min-width:768px){
    .shade{
      background:
        radial-gradient(110% 75% at 50% 42%, rgba(6,12,42,.18) 0%, rgba(6,12,42,.5) 62%, rgba(6,12,42,.82) 100%),
        linear-gradient(180deg, rgba(6,12,42,.4) 0%, rgba(6,12,42,0) 26%, rgba(6,12,42,.6) 68%, rgba(6,12,42,.95) 100%);
    }
    .content{align-items:center;justify-content:space-between}
    .brand{flex:0;padding-top:clamp(40px,10vh,120px)}
    .brand img{width:min(54vw,640px)}
    .tagline br{display:none}
    .tagline .t2{font-size:clamp(26px,2.6vw,38px)}
    .info{width:min(100%,860px)}
    .eyebrow{justify-content:center;margin-bottom:14px}
    .eyebrow::after{content:"";width:28px;height:1px;background:var(--gold)}
    .contacts{grid-template-columns:1fr 1fr}
    .contact{padding:14px 40px 18px;border-bottom:0}
    .contact:first-child{border-right:1px solid var(--hair)}
    .num{font-size:clamp(30px,3.4vw,42px)}
    .address{display:flex;justify-content:center;margin-top:clamp(22px,4vh,40px)}
    .map{width:min(100%,520px)}
  }
</style>
</head>

<script>
  // Reforça o autoplay mudo; se o navegador bloquear, fica a imagem de fallback.
  (function(){
    var v = document.querySelector(".media video");
    if (!v) return;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches){ v.removeAttribute("autoplay"); v.pause(); return; }
    v.muted = true;
    var p = v.play(); if (p && p.catch) p.catch(function(){});
  })();
</script>
